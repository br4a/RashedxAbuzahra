name: Build

on:
  push:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-xcode

      - name: Link Xcode iOS SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK: $SDK_PATH (v$SDK_VER)"
          ln -sf "$SDK_PATH" "theos/sdks/iPhoneOS${SDK_VER}.sdk"

      - name: Build
        run: make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: RashedxAbuzahra-deb
          path: packages/*.deb

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: RashedxAbuzahra-dylib
          path: .theos/obj/RashedxAbuzahra.dylib
