name: Build

on:
  push:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fakeroot zstd

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: theos-sdks-latest

      - name: Download SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_URL=$(curl -fsSL https://api.github.com/repos/theos/sdks/releases/latest \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
for a in data['assets']:
    if a['name'].endswith('.sdk.tar.zst'):
        print(a['browser_download_url'])
        break
")
          echo "Downloading: $SDK_URL"
          curl -fL "$SDK_URL" | tar -I zstd -xf - -C theos/sdks/

      - name: Build
        run: make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: RashedxAbuzahra-deb
          path: packages/*.deb

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: RashedxAbuzahra-dylib
          path: .theos/obj/RashedxAbuzahra.dylib
